<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Dancing Banana</title>
    <style>
      body {
        text-align: center;
        font-family: sans-serif;
        background: #236d4f;
        margin-top: 50px;
      }

      #banana {
        margin: 20px auto;
        width: 150px;
        transition: transform 0.3s;
      }

      #banana.dance {
        animation: shake 0.5s infinite;
      }

      @keyframes shake {
        0%   { transform: rotate(0deg); }
        25%  { transform: rotate(10deg); }
        50%  { transform: rotate(-10deg); }
        75%  { transform: rotate(10deg); }
        100% { transform: rotate(0deg); }
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        background: #184835;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover {
        background: #52efb0;
      }
    </style>
  </head>
  <body>
    <h1>This is not repurposed code I wrote already</h1>
    <button onclick="danceBanana()">Play music!</button>
    <img id="banana" src="guitar.png" alt="Dancing Banana" />
    
    <script>
      function danceBanana() {
        const banana = document.getElementById('banana');
        banana.style.display = 'block';
        banana.classList.add('dance');
        setTimeout(() => {
          banana.classList.remove('dance');
        }, 3000); // stop dancing after 3 seconds
      }
    </script>
  </body>
</html>
